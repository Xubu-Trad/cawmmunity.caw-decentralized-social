<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local username registration · community.caw</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/website.css"><script type="module" src="/wallet.mjs"></script></head>
<body class="website-page"><main class="website-wrap"><section class="terminal-window name-console"><header class="window-title">COMMUNITY.CAW / DISPOSABLE CHAIN</header><div class="window-body">
<h1>Register a username</h1><p id="legacy-post"><a class="terminal-link" href="http://127.0.0.1:34738/">Publish with your registered name or check a post</a></p><p>Your wallet signs on chain 1337. The fixture tokens and gas are for this local session.</p>
<label for="wallet-choice">Signing wallet</label> <select id="wallet-choice" disabled></select>
<button id="connect" class="terminal-link">Connect local wallet</button> <button id="fund" class="terminal-link" disabled>Get test funds</button><p id="account"></p>
<label for="name">Username</label><input id="name" placeholder="newhunter" autocomplete="off" autocapitalize="none" spellcheck="false">
<button id="review" class="terminal-link" disabled>Review name and price</button><p id="quote"></p>
<button id="approve" class="terminal-link" disabled>Approve exact price</button> <button id="register" class="terminal-link" disabled>Register name</button>
<p id="status" role="status"></p><pre id="receipt"></pre><p id="recheck-wrap" hidden><button id="recheck" class="terminal-link">Recheck mined registration</button></p>
<section id="runtime" hidden><h2>Use your username</h2>
<label for="operation">Action</label><select id="operation"><option value="post">Publish</option><option value="like">Like</option><option value="recaw">reCAW</option><option value="follow">Follow</option><option value="deposit">Deposit to username</option><option value="withdraw">Withdraw to wallet</option></select>
<label id="argument-label" for="argument">Post text</label><textarea id="argument"></textarea>
<button id="inspect-action">Review action</button><p id="terms"></p><button id="sign-action" disabled>Sign</button><pre id="action-receipt" aria-live="polite"></pre></section>
</div></section></main></body></html>
