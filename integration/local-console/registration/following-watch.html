<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Followed posts · community.caw</title><link rel="stylesheet" href="/checkpoint/style.css"><link rel="stylesheet" href="/checkpoint/portal.css"><script type="module" src="/checkpoint/following.mjs"></script></head>
<body class="website-page"><main class="website-wrap"><section class="terminal-window name-console"><div class="window-title">COMMUNITY.CAW / DISPOSABLE CHAIN</div><div class="window-body"><h1>Followed posts</h1><form><label>Your registered username <input id="name" required pattern="[a-z0-9]+" autocapitalize="none"></label><details><summary>Check against another operator’s checkpoint</summary><p>Enter both values from a source you trust to view the feed at that block. Leave both empty to follow the local tip.</p><label>Checkpoint height (hex) <input id="height" placeholder="0x25"></label><label>Checkpoint hash <input id="hash" spellcheck="false"></label></details><button>Watch feed</button></form><p id="status" role="status">Enter your username to watch posts and their verified payouts.</p><div id="items"></div></div></section></main></body></html>
